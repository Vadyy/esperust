[package]
name = "esperust"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Independent EU1162 Circle 2 recreation experiment"
license = "MIT"
publish = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/branding/*",
    "/rust-toolchain.toml",
    "/README.md",
    "/LICENSE",
    "/build-linux.sh",
    "/build-windows.bat",
    "/build-windows.ps1",
    "/src/**/*.rs",
    "/src/**/*.wgsl",
    "/tools/*.py",
    "/tools/data/*.json",
    "/tools/requirements.txt",
    "/config/controller.json",
    "/config/music.json",
]

[dependencies]
bevy = { version = "=0.18.1", default-features = false, features = ["std", "default_app", "3d_bevy_render", "ui_bevy_render", "bevy_winit", "x11", "wayland", "multi_threaded", "default_font", "png", "dds", "bevy_audio", "vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = { version = "=0.30.13", default-features = false }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1
